# Development stack — Postgres + API + Web + Admin with hot-reload.
#
# Local coding only. Do NOT deploy to Coolify/VPS with this file.
# Coolify: use docker-compose.yml or docker-compose.coolify.yml only.
# Production images on localhost: docker-compose.yml + docker-compose.local.yml.
#
# First time (build images once):
#   podman compose -f docker-compose.dev.yml up --build -d
#
# Day-to-day (no rebuild — source edits hot-reload; new packages auto-install on restart):
#   podman compose -f docker-compose.dev.yml up -d
#
# After changing package.json / package-lock.json in any app:
#   podman compose -f docker-compose.dev.yml restart api    # or admin / web
#
# Seed database (once):
#   podman compose -f docker-compose.dev.yml exec api npm run db:seed
#
# Host ports match docker-compose.local.yml (production-style localhost access):
#   api   → http://localhost:8000
#   web   → http://localhost:3002
#   admin → http://localhost:8001  (native Vite dev port; prod local uses 3003)
#   db    → localhost:5432
#
# Fedora / SELinux: Podman's external docker-compose provider ignores :Z on bind
# mounts, so we disable the container SELinux label for dev app services.
x-podman-selinux-dev: &podman-selinux-dev
  security_opt:
    - label=disable

name: sreemanga-resort-dev

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: resort
      POSTGRES_PASSWORD: resort
      POSTGRES_DB: resort_management
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resort -d resort_management"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    <<: *podman-selinux-dev
    build:
      context: .
      dockerfile: apps/server/Dockerfile.dev
    ports:
      - "${RESORT_API_HOST_PORT:-8000}:8000"
    environment:
      NODE_ENV: development
      PORT: 8000
      DATABASE_URL: postgresql://resort:resort@db:5432/resort_management?schema=public
      JWT_SECRET: dev-jwt-secret-sreemanga-resort-pro
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:3002,http://localhost:8001,http://127.0.0.1:3002,http://127.0.0.1:8001
      ADMIN_URL: http://localhost:8001
    volumes:
      - ./apps/server:/app
      - api_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

  admin:
    <<: *podman-selinux-dev
    build:
      context: .
      dockerfile: apps/admin/Dockerfile.dev
    ports:
      - "${RESORT_ADMIN_HOST_PORT:-8001}:8001"
    environment:
      VITE_API_URL: http://localhost:8000/api
      VITE_PUBLIC_SITE_URL: http://localhost:3002
    volumes:
      - ./apps/admin:/app
      - admin_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_started

  web:
    <<: *podman-selinux-dev
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    ports:
      - "${RESORT_WEB_HOST_PORT:-3002}:3002"
    environment:
      NEXT_PUBLIC_SITE_URL: http://localhost:3002
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/public
      NEXT_PUBLIC_USE_DUMMY_API: "false"
      PORT: 3002
      HOSTNAME: 0.0.0.0
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
      - web_next_cache:/app/.next
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
  api_node_modules:
  admin_node_modules:
  web_node_modules:
  web_next_cache:
