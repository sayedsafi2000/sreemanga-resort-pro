# Run the PRODUCTION images on your own machine (no Coolify). Adds host ports to docker-compose.yml.
#
#   cp .env.compose.example .env        # local stand-ins for Coolify's SERVICE_* variables
#   docker compose -f docker-compose.yml -f docker-compose.local.yml --env-file .env up --build -d
#
#   server → http://localhost:8000   web → http://localhost:3002   admin → http://localhost:3003
#
# Do NOT use this file on Coolify — published host ports bypass Traefik's domain routing.
services:
  server:
    ports:
      - '${RESORT_API_HOST_PORT:-8000}:8000'
  web:
    ports:
      - '${RESORT_WEB_HOST_PORT:-3002}:3002'
  admin:
    ports:
      - '${RESORT_ADMIN_HOST_PORT:-3003}:80'
