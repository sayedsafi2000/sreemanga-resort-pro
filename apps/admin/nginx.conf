server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Runtime config written by docker/40-env-js.sh at container start — never cache it.
    location = /env.js {
        add_header Cache-Control "no-store" always;
    }

    # SPA shell: always revalidate so a new deploy is picked up on the next load.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Vite emits hashed filenames under /assets — safe to cache for a long time.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
