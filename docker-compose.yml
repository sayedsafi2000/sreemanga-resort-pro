# Full stack: Postgres + API + public web (Next) + admin (Vite).
#
# Coolify / VPS (no host port conflicts): use this file, or docker-compose.coolify.yml
# (same stack). Set NEXT_PUBLIC_API_URL, VITE_API_URL, CORS_ORIGIN to real HTTPS URLs.
#
# Coolify → Domains (per https://coolify.io/docs/knowledge-base/docker/compose ):
#   Put the INTERNAL port in the domain field so Traefik routes correctly:
#   - web:   https://your-web-host:3002   (port 3002 is required in the field)
#   - api:   https://your-api-host:8000
#   - admin: https://your-admin-host      (container listens on 80; no extra port)
#   The :3002 / :8000 suffix tells Coolify the backend port; users still open 80/443 on the URL.
#
# Local with localhost:ports — also pass docker-compose.local.yml:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
#
# Then seed (once): docker compose run --rm api npx prisma db seed
# Login (after seed): admin@resortnirjon.com / Admin@12345

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: resort
      POSTGRES_PASSWORD: resort
      POSTGRES_DB: resort_management
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U resort -d resort_management']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - '3000'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://resort:resort@db:5432/resort_management?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me-use-long-random-string}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3002,http://localhost:3003,http://localhost:8001,http://127.0.0.1:3002,http://127.0.0.1:3003,http://127.0.0.1:8001}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3002}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/public}
        NEXT_PUBLIC_USE_DUMMY_API: ${NEXT_PUBLIC_USE_DUMMY_API:-false}
    restart: unless-stopped
    expose:
      - '3002'
    depends_on:
      - api

  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
        VITE_PUBLIC_SITE_URL: ${VITE_PUBLIC_SITE_URL:-http://localhost:3002}
    restart: unless-stopped
    expose:
      - '80'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      - api

volumes:
  pgdata:
